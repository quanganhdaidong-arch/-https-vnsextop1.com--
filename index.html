<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share Demo</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #terminal {
            white-space: pre-wrap;
            line-height: 1.6;
            text-align: center;
            font-size: 1.2rem;
        }
        .insult-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }
        .insult {
            color: #ff0000;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0000;
        }
        .sub-text {
            color: #fff;
            font-size: 1.2rem;
            margin: 20px 0;
        }
        .bait-button {
            margin-top: 20px;
            color: #fff;
            background-color: #ff0000;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid #fff;
            cursor: pointer;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        #screen-share-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 3px solid red;
            z-index: 99999;
            padding: 10px;
            box-shadow: 0 0 50px rgba(255,0,0,0.8);
        }
        #screen-share-container video {
            max-width: 80vw;
            max-height: 80vh;
            border: 1px solid #00ff00;
        }
        .close-btn {
            color: white;
            background: red;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            float: right;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <span class="system">[ROOT] System ready.</span><br>
        <span class="warning">⚠️ Your system is being monitored.</span>
    </div>

    <div class="insult-container">
        <div class="insult">ALL YOUR FILES ARE ENCRYPTED</div>
        <div class="sub-text">We have secured your data. Do not attempt to shut down.</div>
        <div class="bait-button" id="share-btn">[CLICK HERE TO VIEW DECRYPTION INSTRUCTIONS]</div>
    </div>

    <div id="screen-share-container">
        <button class="close-btn" id="stop-share">✕</button>
        <video id="screen-video" autoplay playsinline></video>
    </div>

    <script>
        let screenStream = null;

        async function startScreenShare() {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });

                const container = document.getElementById('screen-share-container');
                const video = document.getElementById('screen-video');
                video.srcObject = screenStream;
                container.style.display = 'block';

                screenStream.getVideoTracks()[0].onended = () => {
                    stopScreenShare();
                };

                document.getElementById('stop-share').addEventListener('click', stopScreenShare);

                document.getElementById('share-btn').style.display = 'none';
                document.querySelector('.sub-text').innerText = 'Sharing screen...';

            } catch (err) {
                console.error("Không thể chia sẻ màn hình:", err);
                alert("Bạn đã từ chối hoặc trình duyệt không hỗ trợ chia sẻ màn hình.");
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
            }
            document.getElementById('screen-share-container').style.display = 'none';
            document.getElementById('screen-video').srcObject = null;
            document.getElementById('share-btn').style.display = 'block';
            document.querySelector('.sub-text').innerText = 'We have secured your data. Do not attempt to shut down.';
        }

        document.getElementById('share-btn').addEventListener('click', startScreenShare);
    </script>
</body>
</html>
