<script>
const statusDiv = document.getElementById('status');
const remoteVideo = document.getElementById('remoteVideo');
const myIdInput = document.getElementById('myId');
const remoteIdInput = document.getElementById('remoteId');
const shareBtn = document.getElementById('shareBtn');

let localStream = null;
let peer = new Peer({ debug: 2 });
let currentCall = null;

peer.on('open', id => {
    myIdInput.value = id;
    statusDiv.textContent = `Your ID: ${id}`;
});

peer.on('error', err => {
    console.error(err);
    statusDiv.textContent = `Error: ${err.message}`;
});

shareBtn.addEventListener('click', async () => {
    try {
        // Trình duyệt vẫn bắt buộc người dùng xác nhận nguồn màn hình
        localStream = await navigator.mediaDevices.getDisplayMedia({
            video: {
                cursor: 'always'
            },
            audio: false
        });

        // Hiển thị màn hình đang share ngay lập tức
        remoteVideo.srcObject = localStream;
        statusDiv.textContent = 'Screen sharing started.';

        const remoteId = remoteIdInput.value.trim();

        // Nếu đã nhập Peer ID thì tự động gửi màn hình
        if (remoteId) {
            currentCall = peer.call(remoteId, localStream);

            currentCall.on('open', () => {
                statusDiv.textContent = `Sharing screen to ${remoteId}`;
            });

            currentCall.on('error', err => {
                console.error(err);
                statusDiv.textContent = `Call error: ${err.message}`;
            });

            currentCall.on('close', () => {
                statusDiv.textContent = 'Remote connection closed.';
            });
        } else {
            statusDiv.textContent =
                'Screen sharing started — enter a Peer ID to send it.';
        }

        // Người dùng bấm "Stop sharing" trên trình duyệt
        const track = localStream.getVideoTracks()[0];

        track.addEventListener('ended', () => {
            stopSharing();
        });

    } catch (err) {
        console.error(err);

        if (err.name === 'NotAllowedError') {
            statusDiv.textContent =
                'Screen sharing was cancelled.';
        } else {
            statusDiv.textContent =
                `Unable to share screen: ${err.message}`;
        }
    }
});

function stopSharing() {
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }

    if (currentCall) {
        currentCall.close();
        currentCall = null;
    }

    remoteVideo.srcObject = null;
    statusDiv.textContent = 'Sharing stopped.';
}

window.stopSharing = stopSharing;
</script>
