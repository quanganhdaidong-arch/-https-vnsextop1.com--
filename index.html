<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myau Client Free</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --radius: 24px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b1a;
            color: var(--text-primary);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ============================================================
                   ANIMATED BACKGROUND
                   ============================================================ */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
        }

        /* ============================================================
                   MAIN CONTAINER
                   ============================================================ */
        .app-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================================
                   GLASS CARD
                   ============================================================ */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            padding: 48px 40px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 50%, rgba(255, 255, 255, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.35);
            flex-shrink: 0;
        }

        .logo-text h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0e6ff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .logo-text .sub {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            -webkit-text-fill-color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: #c084fc;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ============================================================
                   GRID LAYOUT
                   ============================================================ */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-top: 8px;
        }

        @media (max-width: 820px) {
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* ============================================================
                   SECTION CARDS
                   ============================================================ */
        .section-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 28px 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }

        .section-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        .section-title i {
            color: #a855f7;
            font-size: 20px;
        }

        .section-title .count {
            margin-left: auto;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 12px;
            border-radius: 100px;
        }

        /* ============================================================
                   DOWNLOAD SECTION
                   ============================================================ */
        .download-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .download-btn-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.3);
            text-decoration: none;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .download-btn-main:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 40px rgba(168, 85, 247, 0.45);
        }

        .download-btn-main:active {
            transform: scale(0.97);
        }

        .download-btn-main i {
            font-size: 20px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .file-list::-webkit-scrollbar {
            width: 4px;
        }

        .file-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.4);
            border-radius: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid transparent;
            transition: var(--transition);
            cursor: default;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .file-item .icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(168, 85, 247, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c084fc;
            font-size: 16px;
            flex-shrink: 0;
        }

        .file-item .info {
            flex: 1;
            min-width: 0;
        }

        .file-item .info .name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .info .meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .file-item .dl-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .file-item .dl-btn:hover {
            background: rgba(168, 85, 247, 0.3);
            color: #c084fc;
        }

        .empty-state {
            text-align: center;
            padding: 32px 12px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 36px;
            opacity: 0.3;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ============================================================
                   UPLOAD / CONFIG SECTION
                   ============================================================ */
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .upload-zone:hover {
            border-color: rgba(168, 85, 247, 0.3);
            background: rgba(168, 85, 247, 0.04);
        }

        .upload-zone.dragover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.08);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.1);
        }

        .upload-zone .icon-big {
            font-size: 42px;
            color: #a855f7;
            opacity: 0.6;
            margin-bottom: 12px;
            display: block;
        }

        .upload-zone h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .upload-zone p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-progress {
            margin-top: 16px;
            display: none;
        }

        .upload-progress.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a855f7, #7c3aed);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .uploaded-files {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .uploaded-file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 13px;
        }

        .uploaded-file-item i {
            color: #4ade80;
        }

        .uploaded-file-item .fname {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .uploaded-file-item .fsize {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .uploaded-file-item .remove-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .uploaded-file-item .remove-btn:hover {
            color: #ef4444;
        }

        /* ============================================================
                   STATUS TOAST
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast.success i {
            color: #4ade80;
        }

        .toast.error i {
            color: #f87171;
        }

        .toast.info i {
            color: #60a5fa;
        }

        /* ============================================================
                   FOOTER
                   ============================================================ */
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 24px;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            color: #c084fc;
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 600px) {
            .glass-card {
                padding: 24px 16px;
            }

            .logo-text h1 {
                font-size: 20px;
            }

            .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .download-btn-main {
                font-size: 15px;
                padding: 14px 20px;
            }

            .section-card {
                padding: 20px 16px;
            }

            .upload-zone {
                padding: 24px 16px;
            }

            .upload-zone .icon-big {
                font-size: 32px;
            }
        }

        @media (max-width: 420px) {
            .glass-card {
                padding: 16px 12px;
                border-radius: 18px;
            }

            .file-item {
                padding: 10px 12px;
                flex-wrap: wrap;
            }

            .file-item .info .meta {
                flex-wrap: wrap;
                gap: 6px;
            }
        }

        /* ============================================================
                   UTILITY ANIMATIONS
                   ============================================================ */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim-fade-up {
            animation: fadeUp 0.6s ease both;
        }

        .anim-delay-1 {
            animation-delay: 0.08s;
        }
        .anim-delay-2 {
            animation-delay: 0.16s;
        }
        .anim-delay-3 {
            animation-delay: 0.24s;
        }
        .anim-delay-4 {
            animation-delay: 0.32s;
        }

        /* spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    BACKGROUND CANVAS
    ============================================================ -->
    <canvas id="bg-canvas"></canvas>
    <div class="bg-gradient-overlay"></div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-msg">Thành công!</span>
    </div>

    <!-- ============================================================
    MAIN APP
    ============================================================ -->
    <div class="app-wrapper">

        <div class="glass-card anim-fade-up">

            <!-- HEADER -->
            <header class="header">
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="fas fa-cat"></i>
                    </div>
                    <div class="logo-text">
                        <h1>myau clinet free</h1>
                        <div class="sub">✦  file sharing platform</div>
                    </div>
                </div>
                <div class="header-actions">
                    <span class="badge"><i class="fas fa-circle" style="color:#4ade80;font-size:8px;margin-right:6px;"></i> online</span>
                </div>
            </header>

            <!-- GRID -->
            <div class="grid-2">

                <!-- LEFT: DOWNLOAD -->
                <section class="section-card anim-fade-up anim-delay-1">
                    <div class="section-title">
                        <i class="fas fa-download"></i>
                        Tải xuống
                        <span class="count" id="file-count">0 tập tin</span>
                    </div>

                    <div class="download-area">
                        <!-- Nút tải tất cả -->
                        <button class="download-btn-main" id="downloadAllBtn">
                            <i class="fas fa-cloud-download-alt"></i>
                            Tải tất cả
                        </button>

                        <!-- Danh sách file -->
                        <div class="file-list" id="fileList">
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <p>Chưa có tập tin nào.<br />Hãy tải lên ở mục Cấu hình bên cạnh.</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- RIGHT: UPLOAD / CONFIG -->
                <section class="section-card anim-fade-up anim-delay-2">
                    <div class="section-title">
                        <i class="fas fa-cog"></i>
                        Cấu hình &amp; Tải lên
                        <span class="count"><i class="fas fa-upload" style="font-size:12px;"></i></span>
                    </div>

                    <!-- Upload zone -->
                    <div class="upload-zone" id="uploadZone">
                        <i class="fas fa-cloud-upload-alt icon-big"></i>
                        <h4>Kéo thả tập tin vào đây</h4>
                        <p>hoặc nhấn để chọn file &bull; Tối đa 50MB</p>
                        <input type="file" id="fileInput" multiple />
                    </div>

                    <!-- Progress -->
                    <div class="upload-progress" id="uploadProgress">
                        <div class="progress-bar">
                            <div class="fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text">
                            <span id="progressLabel">Đang tải lên...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                    </div>

                    <!-- Danh sách file đã upload (local) -->
                    <div class="uploaded-files" id="uploadedFiles"></div>

                    <!-- Nút xóa tất cả -->
                    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
                        <button id="clearAllBtn" style="
                        background: rgba(255,255,255,0.05);
                        border: 1px solid rgba(255,255,255,0.06);
                        color: rgba(255,255,255,0.5);
                        padding: 8px 18px;
                        border-radius: 10px;
                        cursor: pointer;
                        font-size: 13px;
                        transition: var(--transition);
                        font-family: 'Inter', sans-serif;
                    ">
                    <i class="fas fa-trash-alt"></i> Xóa tất cả
                </button>
                <button id="refreshBtn" style="
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.06);
                color: rgba(255,255,255,0.5);
                padding: 8px 18px;
                border-radius: 10px;
                cursor: pointer;
                font-size: 13px;
                transition: var(--transition);
                font-family: 'Inter', sans-serif;
            ">
            <i class="fas fa-sync-alt"></i> Làm mới
        </button>
    </div>
</section>

</div>

<!-- FOOTER -->
<footer class="footer anim-fade-up anim-delay-3">
    <span>
        <i class="fas fa-shield-alt" style="margin-right:6px;"></i>
        Bảo mật SSL &bull; Dữ liệu được lưu trữ an toàn
        &bull; <a href="#">Điều khoản</a>
    </span>
</footer>

</div>
</div>

<!-- ============================================================
JAVASCRIPT
============================================================ -->
<script>
    /* ============================================================
           CONFIG
           ============================================================ */
    const STORAGE_KEY = 'myau_files';
    const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50MB

    /* ============================================================
           STATE
           ============================================================ */
    let files = []; // { id, name, size, type, dataUrl, uploadedAt }
    let uploadQueue = [];

    /* ============================================================
           DOM REFS
           ============================================================ */
    const fileListEl = document.getElementById('fileList');
    const fileCountEl = document.getElementById('file-count');
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const uploadProgress = document.getElementById('uploadProgress');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const progressPercent = document.getElementById('progressPercent');
    const uploadedFilesEl = document.getElementById('uploadedFiles');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');

    /* ============================================================
           TOAST
           ============================================================ */
    let toastTimer = null;

    function showToast(message, type = 'success') {
        const icon = toast.querySelector('i');
        icon.className = 'fas ' + (type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' :
        'fa-info-circle');
        toast.className = 'toast ' + type;
        toastMsg.textContent = message;
        clearTimeout(toastTimer);
        // force reflow
        void toast.offsetWidth;
        toast.classList.add('show');
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 3200);
    }

    /* ============================================================
           STORAGE
           ============================================================ */
    function loadFiles() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    files = parsed;
                    return;
                }
            }
        } catch (_) { /* ignore */ }
        files = [];
    }

    function saveFiles() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
        } catch (_) { /* ignore */ }
    }

    /* ============================================================
           RENDER
           ============================================================ */
    function renderFileList() {
        // update count
        fileCountEl.textContent = files.length + ' tập tin';

        if (files.length === 0) {
            fileListEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>Chưa có tập tin nào.<br />Hãy tải lên ở mục Cấu hình bên cạnh.</p>
                    </div>
                `;
            return;
        }

        let html = '';
        files.forEach((f, idx) => {
            const sizeStr = formatSize(f.size);
            const icon = getFileIcon(f.type, f.name);
            html += `
                    <div class="file-item" data-idx="${idx}">
                        <div class="icon">${icon}</div>
                        <div class="info">
                            <div class="name">${escapeHtml(f.name)}</div>
                            <div class="meta">
                                <span>${sizeStr}</span>
                                <span>•</span>
                                <span>${formatDate(f.uploadedAt)}</span>
                            </div>
                        </div>
                        <button class="dl-btn" data-idx="${idx}" title="Tải xuống">
                            <i class="fas fa-arrow-down"></i>
                        </button>
                    </div>
                `;
        });
        fileListEl.innerHTML = html;

        // Gắn sự kiện cho từng nút tải
        fileListEl.querySelectorAll('.dl-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = parseInt(this.dataset.idx, 10);
                if (!isNaN(idx) && files[idx]) {
                    downloadFile(idx);
                }
            });
        });
    }

    function renderUploadedFiles() {
        if (files.length === 0) {
            uploadedFilesEl.innerHTML = `
                    <div style="text-align:center;padding:12px 0;color:var(--text-secondary);font-size:13px;">
                        <i class="fas fa-upload" style="opacity:0.3;display:block;margin-bottom:6px;font-size:20px;"></i>
                        Chưa có file nào được tải lên.
                    </div>
                `;
            return;
        }

        let html = '';
        // hiển thị 5 file gần nhất
        const recent = files.slice(-5).reverse();
        recent.forEach((f, i) => {
            const sizeStr = formatSize(f.size);
            html += `
                    <div class="uploaded-file-item">
                        <i class="fas fa-file"></i>
                        <span class="fname">${escapeHtml(f.name)}</span>
                        <span class="fsize">${sizeStr}</span>
                        <button class="remove-btn" data-id="${f.id}" title="Xóa">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
        });
        if (files.length > 5) {
            html += `
                    <div style="text-align:center;font-size:12px;color:var(--text-secondary);padding:4px 0;">
                        + ${files.length - 5} tập tin khác
                    </div>
                `;
        }
        uploadedFilesEl.innerHTML = html;

        // Xóa file
        uploadedFilesEl.querySelectorAll('.remove-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                const idx = files.findIndex(f => f.id === id);
                if (idx !== -1) {
                    files.splice(idx, 1);
                    saveFiles();
                    renderAll();
                    showToast('Đã xóa tập tin.', 'info');
                }
            });
        });
    }

    function renderAll() {
        renderFileList();
        renderUploadedFiles();
    }

    /* ============================================================
           HELPERS
           ============================================================ */
    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function formatDate(ts) {
        if (!ts) return '—';
        const d = new Date(ts);
        const now = new Date();
        const diff = Math.floor((now - d) / 1000);
        if (diff < 60) return 'vừa xong';
        if (diff < 3600) return Math.floor(diff / 60) + ' phút trước';
        if (diff < 86400) return Math.floor(diff / 3600) + ' giờ trước';
        return d.toLocaleDateString('vi-VN');
    }

    function getFileIcon(type, name) {
        const ext = name.split('.').pop().toLowerCase();
        const map = {
            'pdf': 'fa-file-pdf',
            'doc': 'fa-file-word',
            'docx': 'fa-file-word',
            'xls': 'fa-file-excel',
            'xlsx': 'fa-file-excel',
            'ppt': 'fa-file-powerpoint',
            'pptx': 'fa-file-powerpoint',
            'jpg': 'fa-file-image',
            'jpeg': 'fa-file-image',
            'png': 'fa-file-image',
            'gif': 'fa-file-image',
            'svg': 'fa-file-image',
            'webp': 'fa-file-image',
            'zip': 'fa-file-archive',
            'rar': 'fa-file-archive',
            '7z': 'fa-file-archive',
            'tar': 'fa-file-archive',
            'gz': 'fa-file-archive',
            'mp4': 'fa-file-video',
            'avi': 'fa-file-video',
            'mkv': 'fa-file-video',
            'mov': 'fa-file-video',
            'mp3': 'fa-file-audio',
            'wav': 'fa-file-audio',
            'flac': 'fa-file-audio',
            'txt': 'fa-file-alt',
            'md': 'fa-file-alt',
            'json': 'fa-file-code',
            'xml': 'fa-file-code',
            'html': 'fa-file-code',
            'css': 'fa-file-code',
            'js': 'fa-file-code',
            'php': 'fa-file-code',
            'py': 'fa-file-code',
            'java': 'fa-file-code',
            'c': 'fa-file-code',
            'cpp': 'fa-file-code',
            'go': 'fa-file-code',
            'rs': 'fa-file-code',
            'swift': 'fa-file-code',
            'kt': 'fa-file-code',
        };
        return map[ext] ? '<i class="fas ' + map[ext] + '"></i>' : '<i class="fas fa-file"></i>';
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function generateId() {
        return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    /* ============================================================
           DOWNLOAD
           ============================================================ */
    function downloadFile(index) {
        const f = files[index];
        if (!f) return;
        try {
            // Tạo link tải từ dataUrl
            const a = document.createElement('a');
            a.href = f.dataUrl;
            a.download = f.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('Đang tải: ' + f.name, 'success');
        } catch (e) {
            showToast('Không thể tải file: ' + e.message, 'error');
        }
    }

    /* ============================================================
           DOWNLOAD ALL (zip không có thư viện -> tải từng cái)
           ============================================================ */
    function downloadAll() {
        if (files.length === 0) {
            showToast('Không có file nào để tải.', 'info');
            return;
        }
        // Tải lần lượt từng file
        let count = 0;
        for (const f of files) {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = f.dataUrl;
                a.download = f.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                count++;
                if (count === files.length) {
                    showToast('Đã tải ' + count + ' tập tin.', 'success');
                }
            }, count * 300);
        }
        showToast('Đang tải ' + files.length + ' tập tin...', 'info');
    }

    /* ============================================================
           UPLOAD
           ============================================================ */
    function handleFiles(fileList) {
        const validFiles = [];
        for (const file of fileList) {
            if (file.size > MAX_FILE_SIZE) {
                showToast('File "' + file.name + '" vượt quá 50MB.', 'error');
                continue;
            }
            validFiles.push(file);
        }
        if (validFiles.length === 0) return;

        uploadProgress.classList.add('active');
        let completed = 0;
        const total = validFiles.length;

        validFiles.forEach((file, idx) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                const newFile = {
                    id: generateId(),
                    name: file.name,
                    size: file.size,
                    type: file.type || 'application/octet-stream',
                    dataUrl: dataUrl,
                    uploadedAt: Date.now(),
                };
                files.push(newFile);
                completed++;
                const pct = Math.round((completed / total) * 100);
                progressFill.style.width = pct + '%';
                progressPercent.textContent = pct + '%';
                progressLabel.textContent = 'Đang tải lên ' + completed + '/' + total + '...';

                if (completed === total) {
                    saveFiles();
                    renderAll();
                    setTimeout(() => {
                        uploadProgress.classList.remove('active');
                        progressFill.style.width = '0%';
                        progressPercent.textContent = '0%';
                        progressLabel.textContent = 'Hoàn tất!';
                        showToast('Tải lên ' + total + ' tập tin thành công!', 'success');
                    }, 400);
                }
            };
            reader.onerror = function() {
                showToast('Lỗi đọc file: ' + file.name, 'error');
                completed++;
                if (completed === total) {
                    saveFiles();
                    renderAll();
                    uploadProgress.classList.remove('active');
                }
            };
            reader.readAsDataURL(file);
        });
    }

    /* ============================================================
           CLEAR ALL
           ============================================================ */
    function clearAllFiles() {
        if (files.length === 0) {
            showToast('Không có file nào để xóa.', 'info');
            return;
        }
        if (confirm('Xóa tất cả ' + files.length + ' tập tin?')) {
            files = [];
            saveFiles();
            renderAll();
            showToast('Đã xóa tất cả tập tin.', 'info');
        }
    }

    /* ============================================================
           EVENT BINDINGS
           ============================================================ */
    // Upload zone click
    uploadZone.addEventListener('click', function(e) {
        if (e.target.tagName !== 'INPUT') {
            fileInput.click();
        }
    });

    // File input change
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            handleFiles(this.files);
            this.value = '';
        }
    });

    // Drag & drop
    uploadZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFiles(e.dataTransfer.files);
        }
    });

    // Download all
    document.getElementById('downloadAllBtn').addEventListener('click', downloadAll);

    // Clear all
    document.getElementById('clearAllBtn').addEventListener('click', clearAllFiles);

    // Refresh
    document.getElementById('refreshBtn').addEventListener('click', function() {
        loadFiles();
        renderAll();
        showToast('Đã làm mới danh sách.', 'info');
    });

    /* ============================================================
           BACKGROUND PARTICLES (Canvas)
           ============================================================ */
    (function initBackground() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];
        const COUNT = 140;
        const MAX_RADIUS = 2.8;
        const MIN_RADIUS = 0.8;
        const SPEED = 0.35;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < COUNT; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: MIN_RADIUS + Math.random() * (MAX_RADIUS - MIN_RADIUS),
                    dx: (Math.random() - 0.5) * SPEED * 1.8,
                    dy: (Math.random() - 0.5) * SPEED * 1.8,
                    opacity: 0.15 + Math.random() * 0.6,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.003 + Math.random() * 0.008,
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // Vẽ các hạt
            for (const p of particles) {
                p.x += p.dx;
                p.y += p.dy;
                p.pulse += p.pulseSpeed;
                const radius = p.r * (0.85 + 0.15 * Math.sin(p.pulse));
                const alpha = p.opacity * (0.7 + 0.3 * Math.sin(p.pulse * 0.7));

                // Chuyển động biên
                if (p.x < 0 || p.x > w) p.dx *= -1;
                if (p.y < 0 || p.y > h) p.dy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
                ctx.fill();

                // glow nhẹ
                if (radius > 1.6) {
                    ctx.shadowColor = 'rgba(168, 85, 247, 0.15)';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius * 2.2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.03)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // Vẽ các đường kết nối
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        const alpha = (1 - dist / 150) * 0.12;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = 'rgba(168, 85, 247, ' + alpha + ')';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            resize();
            createParticles();
        });

        resize();
        createParticles();
        draw();
    })();

    /* ============================================================
           INIT
           ============================================================ */
    loadFiles();
    renderAll();
    showToast('Chào mừng đến với Myau Client Free!', 'info');

    /* ============================================================
           KEYBOARD SHORTCUT (như gợi ý trong ảnh: Ctrl+Shift+M)
           ============================================================ */
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'M') {
            e.preventDefault();
            // Focus vào input file
            fileInput.focus();
            showToast('📂 Đã chuyển đến vùng tải lên.', 'info');
        }
        if (e.key === 'Escape') {
            // Tìm phần tử tương tác tiếp theo (focus vào nút đầu tiên)
            const firstBtn = document.querySelector('.download-btn-main');
            if (firstBtn) firstBtn.focus();
        }
    });

    console.log('🐱 Myau Client Free v1.0 — ' + files.length + ' files loaded.');
    console.log('📌 Shortcut: Ctrl+Shift+M → upload area, Esc → next interactive.');
</script>
