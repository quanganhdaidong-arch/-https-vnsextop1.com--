<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Compromised</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            font-size: 1.1rem;
        }
        #terminal {
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .error { color: #ff0000; font-weight: bold; }
        .success { color: #00ff00; }
        .system { color: #aaaaaa; }
        
        /* Hiệu ứng chớp nháy cho dòng chữ chốt hạ */
        .insult {
            color: #ff0000;
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            margin-top: 10vh;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            animation: glitch 0.05s infinite alternate;
            display: none; /* Ẩn lúc đầu, sau mới hiện */
        }

        @keyframes glitch {
            0% { transform: translate(3px, 2px); }
            25% { transform: translate(-3px, -2px); }
            50% { transform: translate(3px, -2px); }
            75% { transform: translate(-3px, 3px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="insult" class="insult">NGU THÌ CHẾT</div>

    <script>
        // Link ảnh sẽ chuyển hướng tới
        var urlTarget = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSr3N_l4ajFZsCdUVtNX-sXR2975rq12Az0BASkZlJIVzXJM5rd4xkP9D0&s=10";
        
        // Kịch bản các dòng lệnh giả lập hacker
        const lines = [
            "<span class='system'>[ROOT] Initializing exploit payload...</span>",
            "Bypassing Windows Defender... <span class='success'>[SUCCESS]</span>",
            "Establishing backdoor connection to remote server...",
            "Connection established. Target IP mapped.",
            "Scanning local drives for sensitive data...",
            "Accessing directory: C:\\Users\\Admin\\Downloads\\...",
            "Extracting browser cookies and saved passwords...",
            "Searching for Minecraft saved data, mods, and configuration files...",
            "Compiling user data package...",
            "Uploading data... 15%",
            "Uploading data... 47%",
            "Uploading data... 89%",
            "<span class='success'>Upload complete.</span>",
            "<span class='error'>FATAL ERROR: USER INTERACTION DETECTED.</span>",
            "<span class='error'>INITIATING SYSTEM WIPE PROTOCOL...</span>",
            "Deleting system32..."
        ];

        const terminal = document.getElementById('terminal');
        const insult = document.getElementById('insult');
        let lineIndex = 0;

        // Hàm gõ từng dòng lệnh giống hệt máy tính đang chạy script
        function typeLine() {
            if (lineIndex < lines.length) {
                terminal.innerHTML += lines[lineIndex] + "<br>";
                // Tự động cuộn xuống dòng mới
                window.scrollTo(0, document.body.scrollHeight);
                lineIndex++;
                // Thời gian ngẫu nhiên giữa các dòng (từ 0.1s đến 0.6s) để trông thật hơn
                setTimeout(typeLine, Math.random() * 500 + 100);
            } else {
                // Khi chạy xong hết lệnh, hiện dòng chữ chửi
                setTimeout(() => {
                    terminal.style.display = 'none'; // Ẩn màn hình code đi
                    insult.style.display = 'block'; // Bật chữ chửi lên
                    
                    // Chờ thêm 3 giây để nạn nhân đọc chữ rồi mới nảy sang ảnh
                    setTimeout(() => {
                        window.location.replace(urlTarget);
                    }, 3000); 
                }, 800);
            }
        }

        // Bắt đầu chạy ngay khi mở trang web
        window.onload = () => {
            setTimeout(typeLine, 500);
            
            // Backup phòng hờ: Tổng thời gian tối đa chạy trang này là 10 giây
            setTimeout(() => {
                window.location.replace(urlTarget);
            }, 10000); 
        };
    </script>
</body>
</html>
