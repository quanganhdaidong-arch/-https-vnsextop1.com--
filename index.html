<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Compromised</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            font-size: 1.1rem;
            cursor: default; /* Trỏ chuột mặc định */
        }
        #terminal {
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .error { color: #ff0000; font-weight: bold; }
        .warning { color: #ffcc00; }
        .success { color: #00ff00; }
        .system { color: #aaaaaa; }
        
        .insult-container {
            display: none; /* Ẩn lúc đầu */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        .insult {
            color: #ff0000;
            font-size: 4.5rem;
            font-weight: 900;
            text-align: center;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            animation: glitch 0.1s infinite alternate;
        }

        .bait-button {
            margin-top: 30px;
            color: #fff;
            background-color: #ff0000;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid #fff;
            cursor: pointer;
            animation: blink 0.5s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: translate(4px, 3px); }
            25% { transform: translate(-4px, -3px); }
            50% { transform: translate(4px, -3px); }
            75% { transform: translate(-4px, 4px); }
            100% { transform: translate(0); }
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    
    <div id="insult-container" class="insult-container">
        <div class="insult">YOUR COMPUTER HAS BEEN HACKED!</div>
        <div class="bait-button">[CLICK ANYWHERE TO ABORT SYSTEM WIPE]</div>
    </div>

    <script>
        var urlTarget = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSr3N_l4ajFZsCdUVtNX-sXR2975rq12Az0BASkZlJIVzXJM5rd4xkP9D0&s=10";
        
        const lines = [
            "<span class='system'>[ROOT] Initializing exploit payload...</span>",
            "Bypassing Windows Defender... <span class='success'>[SUCCESS]</span>",
            "Establishing backdoor connection to remote server...",
            "Analyzing system hardware... <span class='success'>[8Pack OrionX Detected - High Performance Target]</span>",
            "Scanning local drives for sensitive data...",
            "Accessing directory: C:\\Users\\Admin\\Downloads\\...",
            "Extracting browser cookies, saved passwords, and auto-fill data...",
            "<span class='warning'>[WARNING] Encrypting personal files...</span>",
            "Locating Minecraft custom clients... <span class='success'>[Badlion, SKLauncher Found]</span>",
            "Extracting Raven B+ configuration files... <span class='success'>[Eagle, Legit Scaffold modules bypassed]</span>",
            "Compiling user data package...",
            "Uploading data... 12%",
            "Uploading data... 34%",
            "Uploading data... 67%",
            "Uploading data... 99%",
            "<span class='success'>Upload complete. Data secured on remote server.</span>",
            "<span class='error'>FATAL ERROR: USER INTERACTION DETECTED.</span>",
            "<span class='error'>INITIATING EMERGENCY SYSTEM WIPE PROTOCOL...</span>",
            "Deleting system32... <span class='error'>[ACCESS GRANTED]</span>"
        ];

        const terminal = document.getElementById('terminal');
        const insultContainer = document.getElementById('insult-container');
        let lineIndex = 0;

        function forceDownload() {
            var textContext = "SCAN LOG:\n- Target: Downloads folder\n- Recuva Status: 0 files recovered. Scan failed.\n\n================================\n\nHAHAHA BỊ LỪA RỒI NHÉ!\n\nMáy tính của bạn hoàn toàn an toàn.\nLần sau bớt click dạo linh tinh đi nha!";
            var fileName = "Recuva_Recovery_Log.txt";

            var blob = new Blob([textContext], { type: "text/plain" });
            var link = document.createElement("a");
            link.href = window.URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function typeLine() {
            if (lineIndex < lines.length) {
                terminal.innerHTML += lines[lineIndex] + "<br>";
                window.scrollTo(0, document.body.scrollHeight);
                lineIndex++;
                setTimeout(typeLine, Math.random() * 600 + 400);
            } else {
                // Sau khi chạy xong lệnh, hiện màn hình bẫy
                setTimeout(() => {
                    terminal.style.display = 'none'; 
                    insultContainer.style.display = 'flex'; 
                    document.body.style.cursor = 'pointer'; // Biến con trỏ thành hình bàn tay để lừa click

                    // BẮT SỰ KIỆN CLICK: Bất cứ khi nào nạn nhân click chuột, tải file và chuyển hướng
                    document.body.addEventListener('click', function trapAction() {
                        forceDownload();
                        window.location.replace(urlTarget);
                        document.body.removeEventListener('click', trapAction); // Tránh tải nhiều lần
                    });

                    // Nếu nạn nhân quá lì không thèm click, tự chuyển hướng sau 7 giây (sẽ không có file tải về)
                    setTimeout(() => {
                        window.location.replace(urlTarget);
                    }, 7000); 

                }, 1000);
            }
        }

        window.onload = () => {
            setTimeout(typeLine, 500);
        };
    </script>
</body>
</html>
